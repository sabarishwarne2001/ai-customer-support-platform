<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Helply Admin Dashboard</title>

    <link rel="stylesheet" href="admin.css">

</head>

<body>

    <div class="container">

        <!-- ========================= -->
        <!-- HEADER -->
        <!-- ========================= -->

        <header>

            <h1>Helply Admin Dashboard</h1>

            <p>
                Manage your chatbot knowledge base.
            </p>

        </header>



        <!-- ========================= -->
        <!-- STATS -->
        <!-- ========================= -->

        <section class="stats">

            <div class="card">

                <h3>Documents</h3>

                <h2 id="documentCount">
                    0
                </h2>

            </div>

            <div class="card">

                <h3>Chunks</h3>

                <h2 id="chunkCount">
                    0
                </h2>

            </div>

        </section>



        <!-- ========================= -->
        <!-- UPLOAD -->
        <!-- ========================= -->

        <section class="upload">

            <h2>Upload PDF</h2>

            <input
                type="file"
                id="pdfFile"
                accept=".pdf">

            <button id="uploadButton">

                Upload

            </button>

        </section>



        <!-- ========================= -->
        <!-- SEARCH -->
        <!-- ========================= -->

        <section class="search">

            <input

                type="text"

                id="searchBox"

                placeholder="Search documents..."

            >

        </section>




        <!-- ========================= -->
        <!-- DOCUMENT TABLE -->
        <!-- ========================= -->

        <section class="documents">

            <h2>

                Uploaded Documents

            </h2>

            <table>

                <thead>

                    <tr>

                        <th>Filename</th>
                        
                        <th>Upload Date</th>

                        <th>Chunks</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="documentTable">

                </tbody>

            </table>

        </section>



    </div>

<div id="toast"></div>
<script src="admin.js"></script>

</body>

</html>
